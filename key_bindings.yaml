# description: 键盘快捷键绑定

emacs_editing:                                                                     # Emacs 风格的编辑键绑定
  __append:                                                                        # 追加到现有配置（不覆盖）
    - { when: composing, accept: Control+p, send: Up }                             # Ctrl+P：向上移动/候选词上移
    - { when: composing, accept: Control+n, send: Down }                           # Ctrl+N：向下移动/候选词下移
    - { when: composing, accept: Control+b, send: Left }                           # Ctrl+B：向左移动光标
    - { when: composing, accept: Control+f, send: Right }                          # Ctrl+F：向右移动光标
    - { when: composing, accept: Control+a, send: Home }                           # Ctrl+A：移动到行首
    - { when: composing, accept: Control+e, send: End }                            # Ctrl+E：移动到行尾
    - { when: composing, accept: Control+d, send: Delete }                         # Ctrl+D：删除光标后字符
    - { when: composing, accept: Control+k, send: Shift+Delete }                   # Ctrl+K：删除到行尾
    - { when: composing, accept: Control+h, send: BackSpace }                      # Ctrl+H：退格（同Backspace）
    - { when: composing, accept: Control+g, send: Escape }                         # Ctrl+G：取消/退出
    - { when: composing, accept: Control+bracketleft, send: Escape }               # Ctrl+[：取消（Vim风格）
    - { when: composing, accept: Alt+v, send: Page_Up }                            # Alt+V：向上翻页
    - { when: composing, accept: Control+v, send: Page_Down }                      # Ctrl+V：向下翻页
# 用途：为习惯 Emacs 编辑器的用户提供熟悉的快捷键。

move_by_word_with_tab:
  __append:
    - { when: composing, accept: ISO_Left_Tab, send: Shift+Left }                  # 向左选择单词
    - { when: composing, accept: Shift+Tab, send: Shift+Left }                     # Shift+Tab：向左选择单词
    - { when: composing, accept: Tab, send: Shift+Right }                          # Tab：向右选择单词
# 用途：在输入时快速选择或跳转单词。

paging_with_minus_equal:
  __append:
    - { when: has_menu, accept: minus, send: Page_Up }                             # - 键：向上翻页（候选词）
    - { when: has_menu, accept: equal, send: Page_Down }                           # = 键：向下翻页
# 用途：使用键盘右侧的 - 和 = 键翻页候选词。

paging_with_comma_period:
  __append:
    - { when: paging, accept: comma, send: Page_Up }                               # , 键：向上翻页
    - { when: has_menu, accept: period, send: Page_Down }                          # . 键：向下翻页
# 用途：使用 , 和 . 键翻页，方便右手操作。

paging_with_brackets:
  __append:
    - { when: paging, accept: bracketleft, send: Page_Up }                         # [ 键：向上翻页
    - { when: has_menu, accept: bracketright, send: Page_Down }                    # ] 键：向下翻页
# 用途：使用 [ 和 ] 键翻页，适合程序员。

numbered_mode_switch:
  __append:
    # 数字键区域
    - { when: always, accept: Control+Shift+1, select: .next }                     # Ctrl+Shift+1：切换下一个方案
    - { when: always, accept: Control+Shift+2, toggle: ascii_mode }                # Ctrl+Shift+2：切换中英文
    - { when: always, accept: Control+Shift+3, toggle: full_shape }                # Ctrl+Shift+3：切换全角半角
    - { when: always, accept: Control+Shift+4, toggle: simplification }            # Ctrl+Shift+4：切换简繁体
    - { when: always, accept: Control+Shift+5, toggle: extended_charset }          # Ctrl+Shift+5：切换扩展字符集
    
    # 符号键区域（需要Shift）
    - { when: always, accept: Control+Shift+exclam, select: .next }                # Ctrl+Shift+!：同Ctrl+Shift+1
    - { when: always, accept: Control+Shift+at, toggle: ascii_mode }               # Ctrl+Shift+@：同Ctrl+Shift+2
    - { when: always, accept: Control+Shift+numbersign, toggle: full_shape }       # Ctrl+Shift+#：同3
    - { when: always, accept: Control+Shift+dollar, toggle: simplification }       # Ctrl+Shift+$：同4
    - { when: always, accept: Control+Shift+percent, toggle: extended_charset }    # Ctrl+Shift+%：同5
# 用途：提供一套系统化的模式切换快捷键，两种键盘布局都能用。

windows_compatible_mode_switch:
  __append:
    - { when: always, accept: Shift+space, toggle: full_shape }                    # Shift+空格：切换全角半角
    - { when: always, accept: Control+period, toggle: ascii_punct }                # Ctrl+.：切换中英文标点
# 用途：模仿 Windows 自带的输入法切换习惯。

optimized_mode_switch:
  __append:
    - { when: always, accept: Control+Shift+space, select: .next }                 # Ctrl+Shift+空格：切换方案
    - { when: always, accept: Shift+space, toggle: ascii_mode }                    # Shift+空格：切换中英文
    - { when: always, accept: Control+comma, toggle: full_shape }                  # Ctrl+,：切换全角半角
    - { when: always, accept: Control+period, toggle: ascii_punct }                # Ctrl+.：切换中英文标点
    - { when: always, accept: Control+slash, toggle: simplification }              # Ctrl+/：切换简繁体
    - { when: always, accept: Control+backslash, toggle: extended_charset }        # Ctrl+\：切换扩展字符集
# 用途：更优化的快捷键布局，避免冲突。